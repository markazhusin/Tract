<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tract Chat</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons&display=block">
  <style>
    body { margin:0; font-family: -apple-system, sans-serif; background:#000; color:#fff; height:100vh; display:flex; flex-direction:column; }
    #header { padding:15px; background:#111; text-align:center; font-weight:bold; }
    #devices { padding:10px; background:#111; }
    .device { padding:12px; background:#1a1a1a; margin:8px 0; border-radius:8px; cursor:pointer; }
    #chat { flex:1; padding:15px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; background:#0a0a0a; }
    .msg { max-width:80%; padding:12px 16px; border-radius:18px; }
    .msg.sent { align-self:flex-end; background:#0a5; }
    .msg.received { align-self:flex-start; background:#222; }
    #input { padding:10px; background:#111; display:flex; }
    #messageInput { flex:1; padding:12px; border:none; border-radius:30px; background:#222; color:white; }
    button { margin-left:8px; padding:0 20px; background:#0a5; border:none; border-radius:30px; color:white; }
    .material-icons { font-size: 18px; vertical-align: middle; margin-right: 6px; }
  </style>
</head>
<body>
  <div id="header">Tract — Тестовый чат</div>
  <div id="devices">
    <button onclick="scanBluetooth()" style="width:100%; padding:15px; font-size:16px;"><span class="material-icons" style="vertical-align:middle; margin-right:8px;">search</span>Найти устройства по Bluetooth</button>
    <div id="deviceList" style="margin-top:10px;"></div>
  </div>
  <div id="chat"></div>
  <div id="input">
    <input type="text" id="messageInput" placeholder="Напишите сообщение..." onkeypress="if(event.key==='Enter') sendMsg()">
    <button onclick="sendMsg()">Отправить</button>
  </div>

  <script>
    let myId = "User" + Math.floor(Math.random()*999);
    let connected = null;

    function addMessage(text, isSent) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = `msg ${isSent ? 'sent' : 'received'}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    window.sendMsg = () => {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, true);
      input.value = '';
    };

    window.scanBluetooth = async () => {
      try {
        const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
        connected = device.name || "Device";
        document.getElementById('deviceList').innerHTML = `<div class="device"><span class="material-icons">bluetooth_connected</span>Подключено: ${connected}</div>`;
        addMessage(`Подключено к ${connected}`, false);
      } catch (e) {
        alert("Bluetooth: " + e.message);
      }
    };

    addMessage("Привет! Нажми кнопку 'Найти устройства'", false);
  </script>
</body>
</html>
