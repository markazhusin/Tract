<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TRACT</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons&display=block">
  <style>
    :root {
      --bg: #141515;
      --bg-header: #050508;
      --panel: #050508;
      --panel-input: #1e1f1f;
      --line: #222;
      --text: #f5f5f5;
      --muted: #999;
      --accent: #B7FFF9;
      --accent-hover: #a0e8e2;
      --bubble-in: #1e1f1f;
      --bubble-out: #2a3033;
      --online: #4dcd5e;
      --danger: #e56565;
      --call-bar: #050508;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.4;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; border: none; background: none; color: inherit; }
    input { background: none; border: none; color: inherit; font-size: 16px; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }

    /* ===== APP LAYOUT ===== */
    #app {
      display: flex;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
    }

    /* ===== SIDEBAR ===== */
    #sidebar {
      width: 380px;
      min-width: 320px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      flex-shrink: 0;
    }
    #sidebar .sidebar-header {
      padding: calc(10px + var(--safe-top)) 12px 8px;
      background: var(--bg-header);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #sidebar .sidebar-header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .sidebar-header-right {
      margin-left: auto;
      display: flex;
      gap: 4px;
    }
    .sidebar-header-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .sidebar-header-btn:active { background: rgba(255,255,255,0.06); }

    /* Search */
    .search-section {
      padding: 8px 12px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--line);
    }
    .search-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .search-row input {
      flex: 1;
      padding: 9px 14px;
      background: var(--panel-input);
      border-radius: 20px;
      font-size: 16px;
      color: var(--text);
    }
    .search-row input::placeholder { color: var(--muted); }
    .search-row input:focus { outline: none; }
    .search-btn {
      padding: 9px 16px;
      background: var(--accent);
      color: #141515;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .search-btn:active { opacity: 0.8; }

    /* Sidebar Tabs */
    .sidebar-tabs {
      display: flex;
      padding: 0 8px 6px;
      gap: 4px;
      background: var(--bg-header);
    }
    .tab-btn {
      padding: 7px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #141515;
    }
    .tab-btn:active { opacity: 0.7; }

    /* Sidebar Views */
    .sidebar-views {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }
    .sidebar-view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateX(20px);
      pointer-events: none;
      transition: all 0.25s ease;
    }
    .sidebar-view.active {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }
    .sidebar-view.prev { transform: translateX(-20px); }
    .sidebar-view-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Section */
    .section { padding: 0 0 0 0; }
    .section-title {
      padding: 10px 14px 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .section-content { padding: 0; }

    /* Card (profile) */
    .card {
      background: var(--panel);
      border-radius: 10px;
      padding: 12px;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .card-avatar {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      color: #141515;
    }
    .card-profile { flex: 1; }
    .card-profile-name {
      font-size: 15px;
      font-weight: 600;
      display: block;
      margin-bottom: 2px;
    }
    .card-profile-id {
      font-size: 12px;
      color: var(--muted);
    }

    /* Contact / Chat Items (TG-style) */
    .contact-item {
      padding: 10px 12px;
      margin: 0;
      background: transparent;
      border: none;
      border-radius: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: background 0.15s;
      width: 100%;
    }
    .contact-item:hover,
    .contact-item.active { background: rgba(255,255,255,0.04); }

    .contact-avatar {
      width: 54px;
      height: 54px;
      min-width: 54px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      color: #141515;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }
    .contact-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .contact-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .contact-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .contact-name {
      font-weight: 500;
      font-size: 16px;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      color: var(--text);
    }
    .contact-name.has-unread {
      color: var(--text);
    }
    .contact-preview {
      font-size: 14px;
      color: var(--muted);
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      display: block;
    }
    .contact-preview.has-unread {
      color: var(--text);
    }
    .contact-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
      margin-left: 4px;
      min-width: 0;
    }
    .contact-time {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }
    .contact-badge {
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      background: var(--online);
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
    }
    @media (max-width: 768px) {
      .contact-avatar { width: 48px; height: 48px; min-width: 48px; font-size: 18px; }
    }

    /* Stack */
    .stack { display: flex; flex-direction: column; gap: 10px; }

    /* Field */
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { color: var(--muted); font-size: 12px; }
    .field input {
      background: var(--panel-input);
      border: 1px solid transparent;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
    }
    .field input:focus { outline: none; border-color: var(--accent); }

    /* Buttons */
    .btn {
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--panel-input);
      color: var(--text);
      font-weight: 500;
      text-align: center;
      font-size: 14px;
    }
    .btn.primary { background: var(--accent); color: #141515; }
    .btn.primary:active { opacity: 0.85; }
    .btn.subtle { background: transparent; border: 1px solid var(--muted); color: var(--muted); }

    /* Status */
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      margin: 4px 10px;
      font-size: 12px;
      border-radius: 8px;
      background: rgba(183, 255, 249, 0.08);
      color: var(--accent);
    }
    .status-indicator.offline { background: rgba(112, 132, 153, 0.1); color: var(--muted); }
    .status-indicator.error { background: rgba(229, 101, 101, 0.1); color: var(--danger); }
    .status-indicator.warn { background: rgba(231, 162, 61, 0.1); color: #e7a23d; }

    /* ===== CHAT AREA ===== */
    #chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg);
    }
    #chatHeader {
      flex-shrink: 0;
      padding: calc(10px + var(--safe-top)) 12px 10px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #chatHeaderMain { flex: 1; min-width: 0; }
    #chatTitle { font-size: 17px; font-weight: 600; }
    #chatSubtitle { color: var(--muted); font-size: 13px; margin-top: 1px; }

    .header-actions {
      display: flex;
      gap: 4px;
      position: relative;
    }
    .header-back-btn {
      display: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .header-back-btn:active { background: rgba(255,255,255,0.06); }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      color: #fff;
    }
    .icon-btn:active { background: rgba(255,255,255,0.06); }
    .material-icons {
      font-size: 20px;
      line-height: 1;
      color: inherit;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Messages */
    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 12px 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .msg {
      max-width: min(480px, 80%);
      padding: 6px 10px 5px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.35;
      word-wrap: break-word;
      animation: msgAppear 0.2s ease;
    }
    @keyframes msgAppear { from { opacity: 0; transform: translateY(6px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .msg.sent {
      align-self: flex-end;
      background: var(--bubble-out);
      border-radius: 12px 4px 12px 12px;
    }
    .msg.received {
      align-self: flex-start;
      background: var(--bubble-in);
      border-radius: 4px 12px 12px 12px;
    }
    .msg.pending { opacity: 1; }
    .msg.selected { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
    .msg time {
      float: right;
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      margin: 2px 0 0 8px;
    }
    .msg.sent time { color: rgba(255,255,255,0.55); }

    .empty-chat {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      padding: 40px 20px;
    }

    /* Selection Bar */
    #selectionBar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--bg-header);
      border-top: 1px solid var(--line);
    }
    #selectionBar .meta { flex: 1; font-size: 14px; color: var(--muted); }
    #selectionBar .btn { font-size: 13px; padding: 8px 12px; }

    /* Chat Menu */
    .chat-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 4px);
      width: 200px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px;
      z-index: 30;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .chat-menu button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      text-align: left;
      font-size: 14px;
    }
    .chat-menu button:hover { background: var(--panel-input); }
    .chat-menu .danger { color: var(--danger); }

    /* Composer */
    #composer {
      flex-shrink: 0;
      padding: 8px 10px calc(10px + var(--safe-bottom));
      background: var(--bg-header);
      border-top: 1px solid var(--line);
    }
    #chat.call-bar-visible #composer { padding-bottom: calc(88px + var(--safe-bottom)); }
    #composerRow { display: flex; gap: 8px; align-items: center; }
    #messageInput {
      flex: 1;
      background: var(--panel-input);
      border: 1px solid transparent;
      color: var(--text);
      padding: 10px 16px;
      border-radius: 22px;
      min-width: 0;
    }
    #messageInput:focus { outline: none; }
    #composerRow .btn.primary {
      flex: 0 0 auto;
      padding: 10px 18px;
      border-radius: 22px;
    }
    @media (max-width: 768px) {
      #sendBtn {
        padding: 8px 14px;
        font-size: 13px;
      }
    }

    /* ===== AUTH ===== */
    #authGate {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: grid;
      place-items: center;
      padding: 20px;
      z-index: 50;
    }
    #authShell {
      width: min(380px, 100%);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .auth-title {
      font-size: 22px;
      font-weight: 600;
      text-align: center;
    }
    .auth-hint {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      line-height: 1.5;
    }
    #authError { color: var(--danger); font-size: 14px; text-align: center; min-height: 20px; }

    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }

    /* ===== SETTINGS ===== */
    .settings-view {
      display: flex;
      flex-direction: column;
      padding: 12px 10px;
      gap: 12px;
    }
    .settings-section {
      background: var(--panel-input);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .settings-label { font-size: 14px; }
    .settings-value { font-size: 13px; color: var(--muted); }
    .settings-section-title {
      padding: 14px 14px 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Avatar upload overlay */
    .avatar-upload {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      overflow: hidden;
      cursor: pointer;
      flex-shrink: 0;
    }
    .avatar-upload .card-avatar {
      width: 100%;
      height: 100%;
      min-width: auto;
      min-height: auto;
      border-radius: 50%;
    }
    .avatar-crop-frame {
      position: absolute;
      inset: 0;
      border: 2px solid rgba(255,255,255,0.72);
      border-radius: 50%;
      pointer-events: none;
      box-sizing: border-box;
      background: radial-gradient(circle at center, transparent 62%, rgba(0,0,0,0.08) 62%);
    }
    .avatar-camera-overlay {
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #141515;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      border: 2px solid var(--panel);
    }

    .chat-header-title {
      cursor: default;
    }
    .chat-header-title.clickable {
      cursor: pointer;
      text-decoration: underline;
    }

    .profile-modal {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 18px;
    }
    .profile-modal.hidden {
      display: none;
    }
    .profile-modal-card {
      width: min(480px, 100%);
      background: var(--panel);
      border-radius: 18px;
      padding: 24px;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      color: var(--text);
    }
    .profile-modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.12);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .profile-modal-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      font-size: 40px;
      font-weight: 700;
      color: #141515;
      background: var(--accent);
    }
    .profile-modal-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .profile-modal-title {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      word-break: break-word;
    }
    .profile-modal-subtitle,
    .profile-modal-status {
      text-align: center;
      color: var(--muted);
      margin-bottom: 10px;
      font-size: 14px;
      word-break: break-word;
    }
    .profile-modal-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 14px;
    }
    .profile-modal-actions .btn { flex: 1; min-width: 130px; }

    .contact-group-header {
      padding: 12px 12px 4px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }

    .contact-name-button {
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      color: inherit;
      font: inherit;
      cursor: pointer;
      text-align: left;
    }

    /* ===== CALL BAR ===== */
    #callBar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      background: var(--call-bar);
      border-top: 1px solid var(--line);
      padding: 12px 14px calc(12px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.3);
    }
    #callBarLabel { font-size: 15px; font-weight: 500; }
    #callBarActions { display: flex; gap: 8px; flex-wrap: wrap; }
    #callBarActions .btn { flex: 1; min-width: 120px; }

    audio#remoteAudio { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      #app { position: relative; }
      #sidebar {
        position: absolute;
        inset: 0;
        z-index: 20;
        width: 100%;
        min-width: 0;
        transition: transform 0.3s ease;
        transform: translateX(0);
      }
      #sidebar.chat-open { transform: translateX(-100%); }
      #chat { position: relative; z-index: 10; }
      .header-back-btn { display: flex; }
    }
  </style>
</head>
<body>
  <audio id="remoteAudio" autoplay playsinline></audio>

  <!-- Hidden elements referenced by JS -->
  <span id="selfId" hidden></span>
  <span id="selfPeerId" hidden></span>
  <div id="networkStatus" hidden><span id="statusText"></span></div>
  <input id="inviteLink" hidden>
  <img id="inviteQr" hidden>
  <span id="inviteHint" hidden></span>
  <input type="file" id="avatarUploadInput" accept="image/*" hidden onchange="handleAvatarUpload(event)">

  <!-- AUTH GATE -->
  <div id="authGate">
    <div id="authShell">
      <img src="assets/tract.svg" alt="Tract" style="width:120px;height:auto;margin:0 auto;">
      <div id="registerPanel" class="stack" style="gap:12px;">
        <div class="field">
          <label>Логин</label>
          <input id="registerName" type="text" placeholder="@login" autocomplete="username">
        </div>
        <div class="field">
          <label>Пароль</label>
          <input id="registerPassword" type="password" placeholder="Не короче 6 символов">
        </div>
        <div class="field">
          <label>Повтор пароля</label>
          <input id="registerPasswordConfirm" type="password" placeholder="Ещё раз">
        </div>
        <button class="btn primary" type="button" onclick="registerAccount()">Создать аккаунт</button>
        <button class="btn subtle" type="button" onclick="showLogin()">Уже есть аккаунт</button>
      </div>
      <div id="loginPanel" class="stack" hidden style="gap:12px;">
        <div class="auth-hint">Аккаунт: <span id="loginUserId">...</span></div>
        <div class="field">
          <label>Логин</label>
          <input id="loginName" type="text" placeholder="@login" autocomplete="username">
        </div>
        <div class="field">
          <label>Пароль</label>
          <input id="loginPassword" type="password" placeholder="Пароль" autocomplete="current-password">
        </div>
        <button class="btn primary" type="button" onclick="loginAccount()">Войти</button>
        <button class="btn subtle" type="button" onclick="showRegister()">Новый аккаунт</button>
      </div>
      <div id="authError"></div>
    </div>
  </div>

  <!-- CALL BAR -->
  <div id="callBar" hidden>
    <div id="callBarLabel"></div>
    <div id="callBarActions"></div>
  </div>

  <!-- MAIN APP -->
  <div id="app">
    <!-- SIDEBAR -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <img src="assets/tract.svg" alt="Tract" style="height:26px;width:auto;">
        <div class="sidebar-header-right">
          <button type="button" class="sidebar-header-btn" onclick="switchView('settings')" title="Настройки"><span class="material-icons">settings</span></button>
        </div>
      </div>

      <!-- Search -->
      <div class="search-section">
        <div class="search-row">
          <input id="addUserId" type="text" placeholder="Поиск по логину" autocomplete="off">
          <button type="button" class="search-btn" onclick="addContactById()">Найти</button>
        </div>
      </div>

      <div class="sidebar-tabs">
        <button type="button" class="tab-btn active" id="tabChats" onclick="switchView('chats')">Чаты</button>
        <button type="button" class="tab-btn" id="tabContacts" onclick="switchView('contacts')">Контакты</button>
      </div>

      <div class="sidebar-views">
        <!-- CHATS VIEW -->
        <div id="viewChats" class="sidebar-view active">
          <div class="sidebar-view-scroll">
            <!-- Contacts rendered here -->
            <div id="contacts"></div>
          </div>
        </div>

        <!-- CONTACTS VIEW -->
        <div id="viewContacts" class="sidebar-view">
          <div class="sidebar-view-scroll">
            <div class="section-title">Все контакты</div>
            <div id="contactsList"></div>
          </div>
        </div>

        <!-- SETTINGS VIEW -->
        <div id="viewSettings" class="sidebar-view">
          <div class="sidebar-view-scroll">
            <div class="settings-view">
              <!-- Profile Section -->
              <div class="settings-section" style="padding:20px;">
                <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
                  <div class="avatar-upload" id="avatarUploadWrapper">
                    <div class="card-avatar" id="profileAvatarSettings" style="width:80px;height:80px;min-width:80px;font-size:36px;">−</div>
                    <div class="avatar-crop-frame"></div>
                    <div class="avatar-camera-overlay" onclick="document.getElementById('avatarUploadInput').click()"><span class="material-icons">photo_camera</span></div>
                  </div>
                  <div style="text-align:center;">
                    <div class="card-profile-name" id="profileNameSettings" style="font-size:18px;font-weight:600;">−</div>
                    <div class="card-profile-id" id="profileUserIdSettings" style="font-size:13px;color:var(--muted);margin-top:4px;">...</div>
                  </div>
                </div>
                <div class="field" style="margin-top:12px;">
                  <label>Отображаемое имя</label>
                  <input id="displayNameInput" type="text" placeholder="@login">
                </div>
                <button type="button" class="btn primary" onclick="saveOwnProfile()">Сохранить</button>
              </div>

              <div class="settings-section-title">АККАУНТ</div>
              <div class="settings-section">
                <div class="settings-row">
                  <span class="settings-label">Логин</span>
                  <span class="settings-value" id="settingUserId">...</span>
                </div>
              </div>

              <div class="settings-section-title">ВИД</div>
              <div class="settings-section">
                <div class="settings-row">
                  <span class="settings-label">Тема</span>
                  <span class="settings-value">Тёмная</span>
                </div>
              </div>

              <div class="settings-section" style="border:1px solid rgba(229,101,101,0.25);margin-top:8px;">
                <div class="settings-row">
                  <span class="settings-label" style="color:var(--danger);">Выйти из аккаунта</span>
                  <button type="button" class="btn subtle" onclick="logoutAccount()" style="border-color:var(--danger);color:var(--danger);padding:6px 12px;font-size:13px;">Выйти</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div id="contactProfileModal" class="profile-modal hidden" hidden>
          <div class="profile-modal-card">
            <button type="button" class="profile-modal-close" onclick="closeContactProfile()" title="Закрыть">×</button>
            <div class="profile-modal-avatar" id="profileModalAvatar">A</div>
            <div class="profile-modal-title" id="profileModalName">Имя</div>
            <div class="profile-modal-subtitle" id="profileModalId">@login</div>
            <div class="profile-modal-status" id="profileModalStatus">В сети</div>
            <div class="profile-modal-actions">
              <button type="button" class="btn primary" id="profileCallBtn" onclick="startVoiceCallFromProfile()">Позвонить</button>
              <button type="button" class="btn subtle" id="profileBlockBtn" onclick="toggleContactBlockFromProfile()">Заблокировать</button>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- CHAT MAIN -->
    <main id="chat">
      <header id="chatHeader">
        <button type="button" class="header-back-btn" onclick="goBackFromChat()">←</button>
        <div id="chatHeaderMain">
          <div id="chatTitle" class="chat-header-title">Чаты</div>
          <div id="chatSubtitle">Выберите диалог</div>
        </div>
        <div class="header-actions">
          <button type="button" class="icon-btn" id="btnCall" hidden onclick="startVoiceCall()" title="Звонок"><span class="material-icons">phone</span></button>
          <button type="button" class="icon-btn" id="btnChatMenu" hidden onclick="toggleChatMenu()" title="Ещё"><span class="material-icons">more_vert</span></button>
          <div class="chat-menu" id="chatMenu" hidden>
            <button type="button" onclick="clearCurrentHistory('me')">Очистить у меня</button>
            <button type="button" onclick="clearCurrentHistory('all')">Очистить у всех</button>
            <button type="button" class="danger" onclick="deleteCurrentChat()">Удалить чат</button>
          </div>
        </div>
      </header>

      <section id="messages">
        <div class="empty-chat">Войдите и найдите контакт по логину</div>
      </section>

      <div id="selectionBar" hidden>
        <span class="meta">Выбрано: <span id="selectionCount">0</span></span>
        <button type="button" class="btn" onclick="deleteSelectedMessages('me')">У меня</button>
        <button type="button" class="btn" onclick="deleteSelectedMessages('all')">У всех</button>
        <button type="button" class="btn" onclick="clearMessageSelection()">Снять</button>
      </div>

      <footer id="composer">
        <div id="composerRow">
          <input id="messageInput" type="text" placeholder="Сообщение" enterkeyhint="send" autocomplete="off"
            onkeydown="if(event.key==='Enter') sendCurrentMessage()">
          <button type="button" class="btn primary" id="sendBtn" onclick="sendCurrentMessage()" title="Отправить">
            <span class="material-icons">send</span>
          </button>
        </div>
      </footer>
    </main>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
