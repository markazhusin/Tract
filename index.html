<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TRACT</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons&display=block">
  <style>
    :root {
      --bg: #141515;
      --bg-header: #050508;
      --panel: #050508;
      --panel-input: #1e1f1f;
      --line: #222;
      --text: #f5f5f5;
      --muted: #999;
      --accent: #B7FFF9;
      --accent-hover: #a0e8e2;
      --bubble-in: #1e1f1f;
      --bubble-out: #2a3033;
      --online: #4dcd5e;
      --danger: #e56565;
      --call-bar: #050508;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.4;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; border: none; background: none; color: inherit; }
    input { background: none; border: none; color: inherit; font-size: 16px; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }

    /* ===== APP LAYOUT ===== */
    #app {
      display: flex;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
    }

    /* ===== SIDEBAR ===== */
    #sidebar {
      width: 380px;
      min-width: 320px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      flex-shrink: 0;
    }
    #sidebar .sidebar-header {
      padding: calc(10px + var(--safe-top)) 12px 8px;
      background: var(--bg-header);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #sidebar .sidebar-header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .sidebar-header-right {
      margin-left: auto;
      display: flex;
      gap: 4px;
    }
    .sidebar-header-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .sidebar-header-btn:active { background: rgba(255,255,255,0.06); }

    /* Search */
    .search-section {
      padding: 8px 12px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--line);
    }
    .search-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .search-row input {
      flex: 1;
      padding: 9px 14px;
      background: var(--panel-input);
      border-radius: 20px;
      font-size: 16px;
      color: var(--text);
    }
    .search-row input::placeholder { color: var(--muted); }
    .search-row input:focus { outline: none; }
    .search-btn {
      padding: 9px 16px;
      background: var(--accent);
      color: #141515;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .search-btn:active { opacity: 0.8; }

    /* Sidebar Tabs */
    .sidebar-tabs {
      display: flex;
      padding: 0 8px 6px;
      gap: 4px;
      background: var(--bg-header);
    }
    .tab-btn {
      padding: 7px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #141515;
    }
    .tab-btn:active { opacity: 0.7; }

    /* Sidebar Views */
    .sidebar-views {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }
    .sidebar-view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateX(20px);
      pointer-events: none;
      transition: all 0.25s ease;
    }
    .sidebar-view.active {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }
    .sidebar-view.prev { transform: translateX(-20px); }
    .sidebar-view-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Section */
    .section { padding: 0 0 0 0; }
    .section-title {
      padding: 10px 14px 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .section-content { padding: 0; }

    /* Card (profile) */
    .card {
      background: var(--panel);
      border-radius: 10px;
      padding: 12px;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .card-avatar {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      color: #141515;
    }
    .card-profile { flex: 1; }
    .card-profile-name {
      font-size: 15px;
      font-weight: 600;
      display: block;
      margin-bottom: 2px;
    }
    .card-profile-id {
      font-size: 12px;
      color: var(--muted);
    }

    /* Contact / Chat Items (TG-style) */
    .contact-item {
      padding: 10px 12px;
      margin: 0;
      background: transparent;
      border: none;
      border-radius: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: background 0.15s;
      width: 100%;
    }
    .contact-item:hover,
    .contact-item.active { background: rgba(255,255,255,0.04); }

    .contact-avatar {
      width: 54px;
      height: 54px;
      min-width: 54px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      color: #141515;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }
    .contact-avatar-clickable {
      cursor: pointer;
    }
    .contact-avatar-clickable:active { opacity: 0.8; }
    .contact-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .contact-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .contact-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .contact-name {
      font-weight: 500;
      font-size: 16px;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      color: var(--text);
    }
    .contact-name.has-unread {
      color: var(--text);
    }
    .contact-preview {
      font-size: 14px;
      color: var(--muted);
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      display: block;
    }
    .contact-preview.has-unread {
      color: var(--text);
    }
    .contact-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
      margin-left: 4px;
      min-width: 0;
    }
    .contact-time {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }
    .contact-badge {
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      background: var(--online);
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
    }
    @media (max-width: 768px) {
      .contact-avatar { width: 48px; height: 48px; min-width: 48px; font-size: 18px; }
    }

    /* Stack */
    .stack { display: flex; flex-direction: column; gap: 10px; }

    /* Field */
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { color: var(--muted); font-size: 12px; }
    .field input {
      background: var(--panel-input);
      border: 1px solid transparent;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
    }
    .field input:focus { outline: none; border-color: var(--accent); }

    /* Buttons */
    .btn {
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--panel-input);
      color: var(--text);
      font-weight: 500;
      text-align: center;
      font-size: 14px;
    }
    .btn.primary { background: var(--accent); color: #141515; }
    .btn.primary:active { opacity: 0.85; }
    .btn.subtle { background: transparent; border: 1px solid var(--muted); color: var(--muted); }

    /* Status */
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      margin: 4px 10px;
      font-size: 12px;
      border-radius: 8px;
      background: rgba(183, 255, 249, 0.08);
      color: var(--accent);
    }
    .status-indicator.offline { background: rgba(112, 132, 153, 0.1); color: var(--muted); }
    .status-indicator.error { background: rgba(229, 101, 101, 0.1); color: var(--danger); }
    .status-indicator.warn { background: rgba(231, 162, 61, 0.1); color: #e7a23d; }

    /* ===== CHAT AREA ===== */
    #chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg);
    }
    #chatHeader {
      flex-shrink: 0;
      padding: calc(10px + var(--safe-top)) 12px 10px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #chatHeaderMain { flex: 1; min-width: 0; }
    #chatTitle { font-size: 17px; font-weight: 600; }
    #chatSubtitle { color: var(--muted); font-size: 13px; margin-top: 1px; }

    .header-actions {
      display: flex;
      gap: 4px;
      position: relative;
    }
    .header-back-btn {
      display: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .header-back-btn:active { background: rgba(255,255,255,0.06); }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      color: #fff;
    }
    .icon-btn:active { background: rgba(255,255,255,0.06); }
    .material-icons {
      font-size: 20px;
      line-height: 1;
      color: inherit;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Messages */
    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 12px 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .msg {
      max-width: min(480px, 80%);
      padding: 6px 10px 5px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.35;
      word-wrap: break-word;
      animation: msgAppear 0.2s ease;
    }
    @keyframes msgAppear { from { opacity: 0; transform: translateY(6px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .msg.sent {
      align-self: flex-end;
      background: var(--bubble-out);
      border-radius: 12px 4px 12px 12px;
    }
    .msg.received {
      align-self: flex-start;
      background: var(--bubble-in);
      border-radius: 4px 12px 12px 12px;
    }
    .msg.pending { opacity: 1; }
    .msg.selected { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
    .msg time {
      float: right;
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      margin: 2px 0 0 8px;
    }
    .msg.sent time { color: rgba(255,255,255,0.55); }

    .empty-chat {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      padding: 40px 20px;
    }

    /* Selection Bar */
    #selectionBar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--bg-header);
      border-top: 1px solid var(--line);
    }
    #selectionBar .meta { flex: 1; font-size: 14px; color: var(--muted); }
    #selectionBar .btn { font-size: 13px; padding: 8px 12px; }

    /* Chat Menu */
    .chat-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 4px);
      width: 200px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px;
      z-index: 30;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .chat-menu button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      text-align: left;
      font-size: 14px;
    }
    .chat-menu button:hover { background: var(--panel-input); }
    .chat-menu .danger { color: var(--danger); }

    /* Composer */
    #composer {
      flex-shrink: 0;
      padding: 8px 10px calc(10px + var(--safe-bottom));
      background: var(--bg-header);
      border-top: 1px solid var(--line);
    }
    #chat.call-bar-visible #composer { padding-bottom: calc(88px + var(--safe-bottom)); }
    #composerRow { display: flex; gap: 8px; align-items: center; }
    #messageInput {
      flex: 1;
      background: var(--panel-input);
      border: 1px solid transparent;
      color: var(--text);
      padding: 10px 16px;
      border-radius: 22px;
      min-width: 0;
    }
    #messageInput:focus { outline: none; }
    #composerRow .btn.primary {
      flex: 0 0 auto;
      padding: 10px 18px;
      border-radius: 22px;
    }
    @media (max-width: 768px) {
      #sendBtn {
        padding: 8px 14px;
        font-size: 13px;
      }
    }

    /* ===== AUTH ===== */
    #authGate {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: grid;
      place-items: center;
      padding: 20px;
      z-index: 50;
    }
    #authShell {
      width: min(380px, 100%);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .auth-title {
      font-size: 22px;
      font-weight: 600;
      text-align: center;
    }
    .auth-hint {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      line-height: 1.5;
    }
    #authError { color: var(--danger); font-size: 14px; text-align: center; min-height: 20px; }

    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }

    /* ===== SETTINGS ===== */
    .settings-view {
      display: flex;
      flex-direction: column;
      padding: 12px 10px;
      gap: 12px;
    }
    .settings-section {
      background: var(--panel-input);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .settings-label { font-size: 14px; }
    .settings-value { font-size: 13px; color: var(--muted); }
    .settings-section-title {
      padding: 14px 14px 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Avatar upload overlay */
    .avatar-upload {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
    }
    .avatar-upload .card-avatar {
      width: 80px;
      height: 80px;
      min-width: 80px;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
    }
    .avatar-upload .card-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .avatar-crop-frame {
      position: absolute;
      inset: 0;
      border: 2px solid rgba(255,255,255,0.92);
      border-radius: 50%;
      pointer-events: none;
      box-sizing: border-box;
    }
    .avatar-camera-overlay {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #141515;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      border: 2px solid var(--bg);
      z-index: 2;
    }

    .chat-header-title {
      cursor: default;
    }
    .chat-header-title.clickable {
      cursor: pointer;
    }
    #chatHeaderMain {
      flex: 1;
      min-width: 0;
      cursor: pointer;
      border-radius: 6px;
      padding: 2px 4px;
      margin: -2px -4px;
    }
    #chatHeaderMain:active { background: rgba(255,255,255,0.05); }

    /* Chat header avatar */
    #chatHeaderAvatar {
      width: 36px;
      height: 36px;
      min-width: 36px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: #141515;
      overflow: hidden;
      cursor: pointer;
      flex-shrink: 0;
    }
    #chatHeaderAvatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #chatHeaderAvatar:active { opacity: 0.8; }

    /* Toggle switch */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
    }
    .toggle-label { font-size: 14px; }
    .toggle-sublabel { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .toggle-switch {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toggle-switch input[type=checkbox] {
      appearance: none;
      -webkit-appearance: none;
      width: 44px;
      height: 26px;
      border-radius: 13px;
      background: var(--panel-input);
      border: 2px solid var(--line);
      cursor: pointer;
      position: relative;
      transition: background 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }
    .toggle-switch input[type=checkbox]::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--muted);
      top: 2px;
      left: 2px;
      transition: transform 0.2s, background 0.2s;
    }
    .toggle-switch input[type=checkbox]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    .toggle-switch input[type=checkbox]:checked::after {
      transform: translateX(18px);
      background: #141515;
    }
    .toggle-value {
      font-size: 13px;
      color: var(--muted);
      min-width: 48px;
      text-align: right;
    }

    /* ===== CONTACT PROFILE PAGE (full-screen, TG-style) ===== */
    #contactProfilePage {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }
    #contactProfilePage.open {
      transform: translateX(0);
    }
    .profile-page-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: calc(10px + var(--safe-top)) 12px 10px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--line);
    }
    .profile-page-back {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      color: var(--accent);
    }
    .profile-page-back:active { background: rgba(255,255,255,0.06); }
    .profile-page-header-title {
      flex: 1;
      font-size: 17px;
      font-weight: 600;
    }
    .profile-page-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .profile-page-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px 20px;
      gap: 12px;
    }
    .profile-page-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 700;
      color: #141515;
      background: var(--accent);
      flex-shrink: 0;
    }
    .profile-page-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .profile-page-name {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      word-break: break-word;
    }
    .profile-page-status {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
    }
    .profile-page-status.online { color: var(--online); }
    .profile-page-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      padding: 0 20px 20px;
      flex-wrap: wrap;
    }
    .profile-page-action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 16px;
      background: var(--panel-input);
      border-radius: 12px;
      min-width: 72px;
      font-size: 12px;
      color: var(--accent);
      border: none;
      cursor: pointer;
    }
    .profile-page-action-btn:active { opacity: 0.7; }
    .profile-page-action-btn .material-icons { font-size: 22px; }
    .profile-page-action-btn.danger { color: var(--danger); }
    .profile-page-section {
      margin: 0 12px 12px;
      background: var(--panel-input);
      border-radius: 12px;
      overflow: hidden;
    }
    .profile-page-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .profile-page-row:last-child { border-bottom: none; }
    .profile-page-row-icon { color: var(--muted); font-size: 20px; }
    .profile-page-row-content { flex: 1; min-width: 0; }
    .profile-page-row-label { font-size: 13px; color: var(--muted); margin-bottom: 2px; }
    .profile-page-row-value { font-size: 15px; word-break: break-all; }

    .contact-group-header {
      padding: 12px 12px 4px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }

    .contact-name-button {
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      color: inherit;
      font: inherit;
      cursor: pointer;
      text-align: left;
    }

    /* ===== CALL BAR ===== */
    #callBar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      background: var(--call-bar);
      border-top: 1px solid var(--line);
      padding: 12px 14px calc(12px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.3);
    }
    #callBarLabel { font-size: 15px; font-weight: 500; }
    #callBarActions { display: flex; gap: 8px; flex-wrap: wrap; }
    #callBarActions .btn { flex: 1; min-width: 120px; }

    audio#remoteAudio { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      #app { position: relative; }
      #sidebar {
        position: absolute;
        inset: 0;
        z-index: 20;
        width: 100%;
        min-width: 0;
        transition: transform 0.3s ease;
        transform: translateX(0);
      }
      #sidebar.chat-open { transform: translateX(-100%); }
      #chat { position: relative; z-index: 10; }
      .header-back-btn { display: flex; }
    }
  </style>
</head>
<body>
  <audio id="remoteAudio" autoplay playsinline></audio>

  <!-- Hidden elements referenced by JS -->
  <span id="selfId" hidden></span>
  <span id="selfPeerId" hidden></span>
  <div id="networkStatus" hidden><span id="statusText"></span></div>
  <input id="inviteLink" hidden>
  <img id="inviteQr" hidden>
  <span id="inviteHint" hidden></span>
  <input type="file" id="avatarUploadInput" accept="image/*" hidden onchange="handleAvatarUpload(event)">

  <!-- AUTH GATE -->
  <div id="authGate">
    <div id="authShell">
      <img src="assets/tract.svg" alt="Tract" style="width:120px;height:auto;margin:0 auto;">
      <div id="registerPanel" class="stack" style="gap:12px;">
        <div class="field">
          <label>Логин</label>
          <input id="registerName" type="text" placeholder="@login" autocomplete="username">
        </div>
        <div class="field">
          <label>Пароль</label>
          <input id="registerPassword" type="password" placeholder="Не короче 6 символов">
        </div>
        <div class="field">
          <label>Повтор пароля</label>
          <input id="registerPasswordConfirm" type="password" placeholder="Ещё раз">
        </div>
        <button class="btn primary" type="button" onclick="registerAccount()">Создать аккаунт</button>
        <button class="btn subtle" type="button" onclick="showLogin()">Уже есть аккаунт</button>
      </div>
      <div id="loginPanel" class="stack" hidden style="gap:12px;">
        <div class="auth-hint">Аккаунт: <span id="loginUserId">...</span></div>
        <div class="field">
          <label>Логин</label>
          <input id="loginName" type="text" placeholder="@login" autocomplete="username">
        </div>
        <div class="field">
          <label>Пароль</label>
          <input id="loginPassword" type="password" placeholder="Пароль" autocomplete="current-password">
        </div>
        <button class="btn primary" type="button" onclick="loginAccount()">Войти</button>
        <button class="btn subtle" type="button" onclick="showRegister()">Новый аккаунт</button>
      </div>
      <div id="authError"></div>
    </div>
  </div>

  <!-- CALL BAR -->
  <div id="callBar" hidden>
    <div id="callBarLabel"></div>
    <div id="callBarActions"></div>
  </div>

  <!-- MAIN APP -->
  <div id="app">
    <!-- SIDEBAR -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <img src="assets/tract.svg" alt="Tract" style="height:26px;width:auto;">
        <div class="sidebar-header-right">
          <button type="button" class="sidebar-header-btn" onclick="switchView('settings')" title="Настройки"><span class="material-icons">settings</span></button>
        </div>
      </div>

      <!-- Search -->
      <div class="search-section">
        <div class="search-row">
          <input id="addUserId" type="text" placeholder="Поиск по логину" autocomplete="off">
          <button type="button" class="search-btn" onclick="addContactById()">Найти</button>
        </div>
      </div>

      <div class="sidebar-tabs">
        <button type="button" class="tab-btn active" id="tabChats" onclick="switchView('chats')">Чаты</button>
        <button type="button" class="tab-btn" id="tabContacts" onclick="switchView('contacts')">Контакты</button>
      </div>

      <div class="sidebar-views">
        <!-- CHATS VIEW -->
        <div id="viewChats" class="sidebar-view active">
          <div class="sidebar-view-scroll">
            <!-- Contacts rendered here -->
            <div id="contacts"></div>
          </div>
        </div>

        <!-- CONTACTS VIEW -->
        <div id="viewContacts" class="sidebar-view">
          <div class="sidebar-view-scroll">
            <div class="section-title">Все контакты</div>
            <div id="contactsList"></div>
          </div>
        </div>

        <!-- SETTINGS VIEW -->
        <div id="viewSettings" class="sidebar-view">
          <div class="sidebar-view-scroll">
            <div class="settings-view">
              <!-- Profile Section -->
              <div class="settings-section" style="padding:20px;">
                <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
                  <div class="avatar-upload" id="avatarUploadWrapper" onclick="document.getElementById('avatarUploadInput').click()">
                    <div class="card-avatar" id="profileAvatarSettings" style="width:80px;height:80px;min-width:80px;font-size:36px;">−</div>
                    <div class="avatar-crop-frame"></div>
                    <div class="avatar-camera-overlay"><span class="material-icons" style="font-size:13px;">photo_camera</span></div>
                  </div>
                  <div style="text-align:center;">
                    <div class="card-profile-name" id="profileNameSettings" style="font-size:18px;font-weight:600;">−</div>
                    <div class="card-profile-id" id="profileUserIdSettings" style="font-size:13px;color:var(--muted);margin-top:4px;">...</div>
                  </div>
                </div>
                <div class="field" style="margin-top:12px;">
                  <label>Отображаемое имя</label>
                  <div style="position:relative;">
                    <input id="displayNameInput" type="text" placeholder="Введите имя"
                      style="background:var(--panel-input);border:1.5px solid var(--accent);color:var(--text);padding:10px 40px 10px 12px;border-radius:8px;width:100%;font-size:15px;">
                    <span class="material-icons" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--accent);font-size:18px;pointer-events:none;">edit</span>
                  </div>
                </div>
                <div style="display:flex;align-items:center;gap:8px;padding:8px 0 0;">
                  <span class="material-icons" style="color:var(--muted);font-size:16px;">alternate_email</span>
                  <span style="font-size:13px;color:var(--muted);">Логин: </span>
                  <span id="settingUserId" style="font-size:13px;color:var(--muted);"></span>
                </div>
                <button type="button" class="btn primary" onclick="saveOwnProfile()">Сохранить</button>
              </div>

              <div class="settings-section-title">КОНФИДЕНЦИАЛЬНОСТЬ</div>
              <div class="settings-section">
                <div class="toggle-row">
                  <div>
                    <div class="toggle-label">Статус онлайн</div>
                    <div class="toggle-sublabel">Кто видит, что вы в сети</div>
                  </div>
                  <div class="toggle-switch">
                    <span class="toggle-value" id="hideOnlineLabel">Виден</span>
                    <input type="checkbox" id="hideOnlineToggle" onchange="toggleHideOnline()">
                  </div>
                </div>
              </div>

              <div class="settings-section-title">ВИД</div>
              <div class="settings-section">
                <div class="settings-row">
                  <span class="settings-label">Тема</span>
                  <span class="settings-value">Тёмная</span>
                </div>
              </div>

              <div class="settings-section" style="border:1px solid rgba(229,101,101,0.25);margin-top:8px;">
                <div class="settings-row">
                  <span class="settings-label" style="color:var(--danger);">Выйти из аккаунта</span>
                  <button type="button" class="btn subtle" onclick="logoutAccount()" style="border-color:var(--danger);color:var(--danger);padding:6px 12px;font-size:13px;">Выйти</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- contact profile is now a full-screen page, see #contactProfilePage below -->
      </div>
    </aside>

    <!-- CHAT MAIN -->
    <main id="chat">
      <header id="chatHeader">
        <button type="button" class="header-back-btn" onclick="goBackFromChat()">←</button>
        <div id="chatHeaderAvatar" hidden></div>
        <div id="chatHeaderMain">
          <div id="chatTitle" class="chat-header-title">Чаты</div>
          <div id="chatSubtitle">Выберите диалог</div>
        </div>
        <div class="header-actions">
          <button type="button" class="icon-btn" id="btnCall" hidden onclick="startVoiceCall()" title="Звонок"><span class="material-icons">phone</span></button>
          <button type="button" class="icon-btn" id="btnChatMenu" hidden onclick="toggleChatMenu()" title="Ещё"><span class="material-icons">more_vert</span></button>
          <div class="chat-menu" id="chatMenu" hidden>
            <button type="button" onclick="clearCurrentHistory('me')">Очистить у меня</button>
            <button type="button" onclick="clearCurrentHistory('all')">Очистить у всех</button>
          </div>
        </div>
      </header>

      <section id="messages">
        <div class="empty-chat">Войдите и найдите контакт по логину</div>
      </section>

      <div id="selectionBar" hidden>
        <span class="meta">Выбрано: <span id="selectionCount">0</span></span>
        <button type="button" class="btn" onclick="deleteSelectedMessages('me')">У меня</button>
        <button type="button" class="btn" onclick="deleteSelectedMessages('all')">У всех</button>
        <button type="button" class="btn" onclick="clearMessageSelection()">Снять</button>
      </div>

      <footer id="composer">
        <div id="composerRow">
          <input id="messageInput" type="text" placeholder="Сообщение" enterkeyhint="send" autocomplete="off"
            onkeydown="if(event.key==='Enter') sendCurrentMessage()">
          <button type="button" class="btn primary" id="sendBtn" onclick="sendCurrentMessage()" title="Отправить">
            <span class="material-icons">send</span>
          </button>
        </div>
      </footer>
    </main>
  </div>

  <!-- CONTACT PROFILE PAGE (full-screen, TG-style) -->
  <div id="contactProfilePage">
    <div class="profile-page-header">
      <button type="button" class="profile-page-back" onclick="closeContactProfile()">
        <span class="material-icons">arrow_back</span>
      </button>
      <div class="profile-page-header-title">Профиль</div>
    </div>
    <div class="profile-page-scroll">
      <div class="profile-page-hero">
        <div class="profile-page-avatar" id="profileModalAvatar">A</div>
        <div class="profile-page-name" id="profileModalName">Имя</div>
        <div class="profile-page-status" id="profileModalStatus">Не в сети</div>
      </div>

      <!-- Action buttons row -->
      <div class="profile-page-actions">
        <button type="button" class="profile-page-action-btn" id="profileCallBtn" onclick="startVoiceCallFromProfile()">
          <span class="material-icons">phone</span>
          Звонок
        </button>
        <button type="button" class="profile-page-action-btn" id="profileBlockBtn" onclick="toggleContactBlockFromProfile()">
          <span class="material-icons">block</span>
          <span id="profileBlockLabel">Блок</span>
        </button>
        <button type="button" class="profile-page-action-btn danger" id="profileDeleteBtn" onclick="deleteContactFromProfile()">
          <span class="material-icons">delete</span>
          Удалить
        </button>
      </div>

      <!-- Info section -->
      <div class="profile-page-section">
        <div class="profile-page-row">
          <span class="material-icons profile-page-row-icon">alternate_email</span>
          <div class="profile-page-row-content">
            <div class="profile-page-row-label">Логин</div>
            <div class="profile-page-row-value" id="profileModalId">@login</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
