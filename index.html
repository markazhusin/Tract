<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050508">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tract">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <title></title>
  <script>
    // Runs before render: apply disguise (Calculator) and hide content while locked,
    // so a shoulder-surfer never glimpses the real app.
    (function () {
      try {
        var mode = localStorage.getItem('tract.lock.mode');
        if (mode === 'calculator' || mode === 'passcode') {
          document.documentElement.setAttribute('data-locked', '1');
        }
        if (mode === 'calculator') {
          document.documentElement.setAttribute('data-mask', 'calc');
          document.title = 'Калькулятор';
          var theme = document.querySelector('meta[name="theme-color"]');
          if (theme) theme.setAttribute('content', '#000000');
          var man = document.querySelector('link[rel="manifest"]');
          if (man) man.setAttribute('href', '/manifest-calc.webmanifest');
          var atitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (atitle) atitle.setAttribute('content', 'Калькулятор');
          var aicon = document.querySelector('link[rel="apple-touch-icon"]');
          if (aicon) aicon.setAttribute('href', '/icons/calc.svg');
          var icon = document.querySelector('link[rel="icon"]');
          if (icon) icon.setAttribute('href', '/icons/calc.svg');
        }
      } catch (e) { /* no-op */ }
    })();
  </script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons&display=block">
  <style>
    :root {
      --bg: #141515;
      --bg-header: #050508;
      --panel: #050508;
      --panel-input: #1e1f1f;
      --line: #222;
      --text: #f5f5f5;
      --muted: #999;
      --accent: #B7FFF9;
      --accent-hover: #a0e8e2;
      --bubble-in: #1e1f1f;
      --bubble-out: #2a3033;
      --online: #4dcd5e;
      --danger: #e56565;
      --call-bar: #050508;
      --safe-bottom: env(safe-area-inset-bottom, constant(safe-area-inset-bottom, 0px));
      --safe-top: env(safe-area-inset-top, constant(safe-area-inset-top, 0px));
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      /* Disable double-tap-to-zoom (and the 300ms tap delay) app-wide. */
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    /* 16px minimum prevents iOS from zooming the page when an input is focused. */
    input, textarea, select { font-size: 16px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.4;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; border: none; background: none; color: inherit; }
    input { background: none; border: none; color: inherit; font-size: 16px; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }

    /* ===== APP LAYOUT ===== */
    #app {
      display: flex;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
    }

    /* ===== SIDEBAR ===== */
    #sidebar {
      width: 380px;
      min-width: 320px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      flex-shrink: 0;
    }
    #sidebar .sidebar-header {
      padding: calc(10px + var(--safe-top)) 12px 8px;
      background: var(--bg-header);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #appLogo { width:36px; height:36px; display:block; }
    #sidebar .sidebar-header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .sidebar-header-right {
      margin-left: auto;
      display: flex;
      gap: 4px;
    }
    .sidebar-header-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .sidebar-header-btn:active { background: rgba(255,255,255,0.06); }

    /* Search */
    .search-section {
      padding: 8px 12px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--line);
    }
    .search-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .search-row input {
      flex: 1;
      padding: 9px 14px;
      background: var(--panel-input);
      border-radius: 20px;
      font-size: 16px;
      color: var(--text);
    }
    .search-row input::placeholder { color: var(--muted); }
    .search-row input:focus { outline: none; }
    .search-btn {
      padding: 9px 16px;
      background: var(--accent);
      color: #141515;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .search-btn:active { opacity: 0.8; }

    /* Sidebar Tabs */
    .sidebar-tabs {
      display: flex;
      padding: 0 8px 6px;
      gap: 4px;
      background: var(--bg-header);
    }
    .tab-btn {
      padding: 7px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #141515;
    }
    .tab-btn:active { opacity: 0.7; }

    /* Sidebar Views */
    .sidebar-views {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }
    .sidebar-view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateX(20px);
      pointer-events: none;
      transition: all 0.25s ease;
    }
    .sidebar-view.active {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }
    .sidebar-view.prev { transform: translateX(-20px); }
    .sidebar-view-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Section */
    .section { padding: 0 0 0 0; }
    .section-title {
      padding: 10px 14px 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .section-content { padding: 0; }

    /* Card (profile) */
    .card {
      background: var(--panel);
      border-radius: 10px;
      padding: 12px;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .card-avatar {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      color: #141515;
      overflow: hidden;
    }
    .card-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .card-profile { flex: 1; }
    .card-profile-name {
      font-size: 15px;
      font-weight: 600;
      display: block;
      margin-bottom: 2px;
    }
    .card-profile-id {
      font-size: 12px;
      color: var(--muted);
    }

    /* Contact / Chat Items (TG-style) */
    .contact-item {
      padding: 10px 12px;
      margin: 0;
      background: transparent;
      border: none;
      border-radius: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: background 0.15s;
      width: 100%;
    }
    .contact-item:hover,
    .contact-item.active { background: rgba(255,255,255,0.04); }

    /* iOS-style swipe-to-delete on chat rows */
    .swipe-row {
      position: relative;
      overflow: hidden;
    }
    .swipe-row .swipe-delete {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 88px;
      border: none;
      background: #ff3b30;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .swipe-row .swipe-delete:active { background: #d8281f; }
    .swipe-row > .contact-item {
      position: relative;
      z-index: 1;
      /* Opaque so the delete action stays hidden until the row is swiped open. */
      background: var(--bg);
      transition: transform 0.22s cubic-bezier(0.25, 0.1, 0.25, 1);
      will-change: transform;
      touch-action: pan-y;
    }
    .swipe-row > .contact-item:hover,
    .swipe-row > .contact-item.active { background: #1c1d1d; }
    .swipe-row.swiping > .contact-item { transition: none; }

    .contact-avatar {
      width: 54px;
      height: 54px;
      min-width: 54px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      overflow: hidden;
      color: #141515;
      flex-shrink: 0;
      position: relative;
    }
    .contact-avatar-clickable {
      cursor: pointer;
    }
    .contact-avatar-clickable:active { opacity: 0.8; }
    .contact-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .contact-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .contact-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .contact-name {
      font-weight: 500;
      font-size: 16px;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      color: var(--text);
    }
    .contact-name.has-unread {
      color: var(--text);
    }
    .contact-preview {
      font-size: 14px;
      color: var(--muted);
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      display: block;
    }
    .contact-preview.has-unread {
      color: var(--text);
    }
    .contact-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
      margin-left: 4px;
      min-width: 0;
    }
    .contact-time {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }
    .contact-badge {
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      background: var(--online);
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
    }
    @media (max-width: 768px) {
      .contact-avatar { width: 48px; height: 48px; min-width: 48px; font-size: 18px; }
    }

    /* Stack */
    .stack { display: flex; flex-direction: column; gap: 10px; }

    /* Field */
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { color: var(--muted); font-size: 12px; }
    .field input {
      background: var(--panel-input);
      border: 1px solid transparent;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
    }
    .field input:focus { outline: none; border-color: var(--accent); }

    /* Buttons */
    .btn {
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--panel-input);
      color: var(--text);
      font-weight: 500;
      text-align: center;
      font-size: 14px;
    }
    .btn.primary { background: var(--accent); color: #141515; }
    .btn.primary:active { opacity: 0.85; }
    .btn.subtle { background: transparent; border: 1px solid var(--muted); color: var(--muted); }

    /* Status */
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      margin: 4px 10px;
      font-size: 12px;
      border-radius: 8px;
      background: rgba(183, 255, 249, 0.08);
      color: var(--accent);
    }
    .status-indicator.offline { background: rgba(112, 132, 153, 0.1); color: var(--muted); }
    .status-indicator.error { background: rgba(229, 101, 101, 0.1); color: var(--danger); }
    .status-indicator.warn { background: rgba(231, 162, 61, 0.1); color: #e7a23d; }

    /* ===== CALL BAR ===== */
    #callBar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--call-bar);
      border-top: 1px solid var(--line);
      padding: 8px 12px calc(8px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 25;
    }
    #callBarLabel {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      padding: 0 4px;
    }
    #callBarActions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    #callBarActions .btn {
      flex: 1;
      min-width: 80px;
      padding: 8px 12px;
      font-size: 13px;
    }

    /* ===== CHAT AREA ===== */
    #chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg);
    }
    #chatHeader {
      flex-shrink: 0;
      padding: calc(10px + var(--safe-top)) 12px 10px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #chatHeaderMain { flex: 1; min-width: 0; }
    #chatTitle { font-size: 17px; font-weight: 600; }
    #chatSubtitle { color: var(--muted); font-size: 13px; margin-top: 1px; }
    #chatHeaderAvatar {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      color: #141515;
      overflow: hidden;
      cursor: pointer;
    }
    #chatHeaderAvatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .header-actions {
      display: flex;
      gap: 4px;
      position: relative;
    }
    .header-back-btn {
      display: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .header-back-btn:active { background: rgba(255,255,255,0.06); }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      color: #fff;
    }
    .icon-btn:active { background: rgba(255,255,255,0.06); }
    .material-icons {
      font-size: 20px;
      line-height: 1;
      color: inherit;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Messages */
    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 12px 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .msg {
      max-width: min(480px, 80%);
      padding: 6px 10px 5px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.35;
      word-wrap: break-word;
      animation: msgAppear 0.2s ease;
    }
    @keyframes msgAppear { from { opacity: 0; transform: translateY(6px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .msg.sent {
      align-self: flex-end;
      background: var(--bubble-out);
      border-radius: 12px 4px 12px 12px;
    }
    .msg.received {
      align-self: flex-start;
      background: var(--bubble-in);
      border-radius: 4px 12px 12px 12px;
    }
    .msg.pending { opacity: 1; }
    .msg.selected { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
    .msg time {
      float: right;
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      margin: 2px 0 0 8px;
    }
    .msg.sent time { color: rgba(255,255,255,0.55); }

    .empty-chat {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      padding: 40px 20px;
    }

    /* Selection Bar */
    #selectionBar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--bg-header);
      border-top: 1px solid var(--line);
    }
    #selectionBar .meta { flex: 1; font-size: 14px; color: var(--muted); }
    #selectionBar .btn { font-size: 13px; padding: 8px 12px; }

    /* Chat Menu */
    .chat-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 4px);
      width: 200px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px;
      z-index: 30;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .chat-menu button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      text-align: left;
      font-size: 14px;
    }
    .chat-menu button:hover { background: var(--panel-input); }
    .chat-menu .danger { color: var(--danger); }

    /* Composer */
    #composer {
      flex-shrink: 0;
      padding: 8px 10px calc(10px + var(--safe-bottom));
      background: var(--bg-header);
      border-top: 1px solid var(--line);
      position: sticky;
      bottom: 0;
      z-index: 20;
    }
    #chat.call-bar-visible #composer { padding-bottom: calc(88px + var(--safe-bottom)); }
    #composerRow { display: flex; gap: 8px; align-items: center; }
    #messageInput {
      flex: 1;
      background: var(--panel-input);
      border: 1px solid transparent;
      color: var(--text);
      padding: 10px 16px;
      border-radius: 22px;
      min-width: 0;
    }
    #messageInput:focus { outline: none; }
    #composerRow .btn.primary {
      flex: 0 0 auto;
      padding: 0;
      width:44px;
      height:44px;
      border-radius: 22px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    #composerRow .btn.primary .material-icons {
      font-size: 22px;
      line-height: 1;
    }
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      #composer {
        padding-bottom: calc(10px + var(--safe-bottom));
      }
    }
      /* Checkbox contact item for group member selection */
      .contact-checkbox-item {
        padding: 10px 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .contact-checkbox-item:active { background: rgba(255,255,255,0.04); }
      .contact-checkbox-item .checkbox {
        width: 22px; height: 22px; min-width: 22px;
        border-radius: 50%;
        border: 2px solid var(--muted);
        display: flex; align-items: center; justify-content: center;
        transition: all 0.15s;
      }
      .contact-checkbox-item .checkbox.checked {
        background: var(--accent);
        border-color: var(--accent);
      }
      .contact-checkbox-item .checkbox.checked::after {
        content: '✓';
        font-size: 13px;
        font-weight: 700;
        color: #141515;
      }
      .contact-checkbox-item .contact-info { flex: 1; min-width: 0; }
      .contact-checkbox-item .contact-avatar { width: 40px; height: 40px; min-width: 40px; font-size: 16px; }

      /* Settings and profile pages */
      .settings-view {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 0 12px 20px;
      }
      .settings-section {
        background: var(--panel);
        border-radius: 16px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .settings-section-title {
        margin: 16px 12px 4px;
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
      }
      .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 0;
      }
      .settings-label { font-size: 14px; color: var(--text); }
      .settings-value { font-size: 14px; color: var(--muted); }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .toggle-switch {
        display: flex;
        align-items: center;
        gap: 10px;
        position: relative;
      }
      .toggle-switch input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        width: 44px;
        height: 26px;
        border-radius: 13px;
        background: #555;
        cursor: pointer;
        position: relative;
        transition: background 0.2s;
        flex-shrink: 0;
        margin: 0;
      }
      .toggle-switch input[type="checkbox"]::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.2s;
      }
      .toggle-switch input[type="checkbox"]:checked {
        background: var(--accent);
      }
      .toggle-switch input[type="checkbox"]:checked::after {
        transform: translateX(18px);
      }
      .toggle-value {
        font-size: 13px;
        color: var(--muted);
      }
      .toggle-label { font-size: 14px; color: var(--text); }
      .toggle-sublabel { font-size: 12px; color: var(--muted); line-height: 1.35; }

      .avatar-upload {
        position: relative;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        overflow: hidden;
        background: var(--panel-input);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .avatar-upload:hover .avatar-camera-overlay { opacity: 1; }
      .avatar-crop-frame {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .avatar-camera-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 10px;
        background: rgba(0,0,0,0.18);
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .profile-page-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: calc(10px + var(--safe-top)) 14px 10px;
        background: var(--bg-header);
        border-bottom: 1px solid var(--line);
      }
      .profile-page-back {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255,255,255,0.04);
      }
      .profile-page-header-title {
        font-size: 17px;
        font-weight: 600;
      }
      .profile-page-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 16px 16px 20px;
        -webkit-overflow-scrolling: touch;
      }
      .profile-page-hero {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        text-align: center;
        padding: 16px 0 12px;
        transition: height 0.3s ease, padding 0.3s ease;
        overflow: hidden;
        will-change: height;
      }
      .profile-page-hero.expanded {
        padding: 0;
        margin: -16px -16px 8px;
      }
      .profile-hero-expanded {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.25s ease, visibility 0.25s ease;
      }
      .profile-hero-expanded[dragging] {
        transition: none;
        visibility: visible;
      }
      .profile-page-hero.expanded .profile-hero-expanded {
        visibility: visible;
        opacity: 1;
      }
      .profile-page-hero.expanded .profile-page-avatar,
      .profile-page-hero.expanded .profile-page-name,
      .profile-page-hero.expanded .profile-page-status {
        visibility: hidden;
        opacity: 0;
      }
      .profile-hero-bg {
        position: absolute;
        inset: 0;
        background: var(--panel-input);
        background-size: cover;
        background-position: center;
      }
      .profile-hero-gradient {
        position: absolute;
        inset: 0;
        background: linear-gradient(transparent 60%, rgba(0,0,0,0.55));
      }
      .profile-hero-info {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 16px 20px;
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        background: rgba(0,0,0,0.25);
      }
      .profile-hero-name {
        font-size: 22px;
        font-weight: 700;
        color: #fff;
      }
      .profile-hero-id {
        font-size: 14px;
        color: rgba(255,255,255,0.7);
        margin-top: 2px;
      }
      .profile-page-avatar {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: var(--accent);
        color: #141515;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        overflow: hidden;
      }
      .profile-page-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
      }
      .profile-page-name {
        font-size: 20px;
        font-weight: 700;
      }
      .profile-page-status {
        font-size: 13px;
        color: var(--muted);
      }
      .profile-page-status.online {
        color: var(--online);
      }
      .profile-page-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 0 0 10px;
        justify-content: center;
      }
      .profile-page-action-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--panel-input);
        color: var(--text);
        font-size: 14px;
        min-width: 120px;
        justify-content: center;
      }
      .profile-page-action-btn.danger {
        background: rgba(229,101,101,0.12);
        color: var(--danger);
      }
      .profile-page-action-btn.danger-outline {
        background: transparent;
        color: var(--danger);
        border: 1px solid rgba(229,101,101,0.3);
      }

      .profile-page-section {
        background: var(--panel);
        border-radius: 16px;
        padding: 12px;
      }
      .profile-page-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid rgba(255,255,255,0.04);
      }
      .profile-page-row:last-child { border-bottom: none; }
      .profile-page-row-icon {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(183,255,249,0.1);
        color: var(--accent);
        font-size: 18px;
        flex-shrink: 0;
      }
      .profile-page-row-content { min-width: 0; }
      .profile-page-row-label {
        color: var(--muted);
        font-size: 13px;
      }
      .profile-page-row-value {
        font-size: 14px;
        color: var(--text);
        word-break: break-word;
      }

      .contact-group-header {
        padding: 10px 14px 4px;
        font-size: 13px;
        color: var(--muted);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.2px;
      }

      .empty { color: var(--muted); }

      /* Auth gate: full-screen overlay, above everything */
      #authGate {
        position: fixed; inset: 0; z-index: 300;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #authGate[hidden] { display: none; }
      .input-prefix {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        font-size: 16px;
        pointer-events: none;
        z-index: 1;
      }

      /* App hidden before auth */
      #app[hidden] { display: none; }

      /* Overlay pages for new message / create group / group info */
      #newMessagePage,
      #createGroupPage,
      #groupInfoPage {
        position: fixed; inset: 0; z-index: 200;
        background: var(--bg);
        display: flex; flex-direction: column;
        transform: translateX(100%);
        transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: transform;
        pointer-events: none;
      }
      #contactProfilePage {
        position: fixed; inset: 0; z-index: 200;
        background: var(--bg);
        display: flex; flex-direction: column;
        transform: translateX(100%);
        transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: transform;
        pointer-events: none;
      }
      #newMessagePage.open,
      #createGroupPage.open,
      #groupInfoPage.open,
      #contactProfilePage.open {
        transform: translateX(0);
        pointer-events: auto;
      }

      /* Group message sender name */
      .msg-sender {
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
        margin-bottom: 2px;
        display: block;
      }

      #sidebar {
        transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      }

      @media (max-width: 768px) {
        #app {
          overflow: hidden;
        }
        #sidebar {
          position: fixed;
          inset: 0;
          width: 100%;
          max-width: 100%;
          height: 100%;
          background: var(--bg);
          z-index: 20;
          transform: translateX(0);
        }
        #sidebar.chat-open {
          transform: translateX(-100%);
          pointer-events: none;
        }
        #chat {
          position: relative;
          z-index: 10;
          width: 100%;
          min-width: 0;
        }
        #chatHeader {
          padding-left: 12px;
          padding-right: 12px;
        }
        .header-back-btn { display: flex; }
      }

      .sw-update-toast {
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: var(--accent);
        color: #000;
        padding: 10px 20px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 9999;
        opacity: 0;
        transition: opacity 0.3s, transform 0.3s;
        pointer-events: none;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      }
      .sw-update-toast.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
        pointer-events: auto;
      }
      .sw-update-btn {
        background: #000;
        color: var(--accent);
        border: none;
        padding: 6px 14px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      /* ===== App lock / calculator disguise ===== */
      html[data-locked] #authGate,
      html[data-locked] #app { display: none !important; }
      /* Pure-black document behind the lock so no grey body/safe-area shows. */
      html[data-locked], html[data-locked] body { background: #000 !important; }

      #lockScreen {
        position: fixed;
        inset: 0;
        z-index: 4000;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-end;
        color: #fff;
        -webkit-user-select: none;
        user-select: none;
      }

      /* Calculator (iOS-like) */
      .calc {
        display: flex;
        flex-direction: column;
        height: 100%;
        max-width: 480px;
        margin: 0 auto;
        width: 100%;
        padding: 0 12px calc(12px + env(safe-area-inset-bottom));
        box-sizing: border-box;
      }
      .calc-screen {
        flex: 1;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 16px 12px;
        font-size: clamp(56px, 18vw, 88px);
        font-weight: 300;
        line-height: 1.05;
        overflow: hidden;
        word-break: break-all;
      }
      .calc-keys {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .calc-key {
        border: none;
        border-radius: 50%;
        aspect-ratio: 1 / 1;
        font-size: clamp(24px, 7vw, 34px);
        font-weight: 500;
        color: #fff;
        background: #333;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-tap-highlight-color: transparent;
        transition: filter 0.1s;
      }
      .calc-key:active { filter: brightness(1.4); }
      .calc-key.fn { background: #a5a5a5; color: #000; }
      .calc-key.op { background: #ff9f0a; }
      .calc-key.zero { grid-column: span 2; aspect-ratio: auto; border-radius: 999px; justify-content: flex-start; padding-left: 28px; }

      /* Passcode pad */
      .passlock {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 28px;
        padding: 24px calc(24px + env(safe-area-inset-bottom));
      }
      .passlock-title { font-size: 17px; color: #aaa; }
      .passlock-dots { display: flex; gap: 18px; }
      .passlock-dot {
        width: 14px; height: 14px; border-radius: 50%;
        border: 1.5px solid #fff; box-sizing: border-box;
        transition: background 0.1s;
      }
      .passlock-dot.filled { background: #fff; }
      .passlock.shake { animation: passShake 0.4s; }
      @keyframes passShake {
        0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)}
        40%{transform:translateX(10px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)}
      }
      .passlock-pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 20px; }
      .passlock-key {
        width: 76px; height: 76px; border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.25); background: transparent;
        color: #fff; font-size: 30px; font-weight: 400; cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .passlock-key:active { background: rgba(255,255,255,0.15); }
      .passlock-key.blank { border: none; background: transparent; cursor: default; }

      /* Lock settings modal */
      .lock-modal-backdrop {
        position: fixed; inset: 0; z-index: 4100;
        background: rgba(0,0,0,0.6);
        display: flex; align-items: center; justify-content: center;
        padding: 16px;
      }
      .lock-modal {
        background: var(--bg-header); border: 1px solid var(--line);
        border-radius: 16px; width: 100%; max-width: 380px;
        padding: 20px; box-sizing: border-box; color: var(--text);
        max-height: 90vh; overflow-y: auto;
      }
      .lock-modal h3 { margin: 0 0 4px; font-size: 18px; }
      .lock-modal p.hint { margin: 0 0 16px; font-size: 13px; color: var(--muted); }
      .lock-modal label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
      .lock-modal input[type="text"],
      .lock-modal input[type="password"] {
        width: 100%; box-sizing: border-box; padding: 12px;
        border-radius: 10px; border: 1px solid var(--line);
        background: var(--bg); color: var(--text); font-size: 16px;
        letter-spacing: 2px;
      }
      .lock-mode-options { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
      .lock-mode-option {
        display: flex; align-items: center; gap: 10px; padding: 12px;
        border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
      }
      .lock-mode-option.active { border-color: var(--accent); }
      .lock-modal-actions { display: flex; gap: 10px; margin-top: 20px; }
      .lock-modal-actions .btn { flex: 1; }
    </style>
</head>
<body>
  <audio id="remoteAudio" autoplay playsinline webkit-playsinline style="position:absolute;width:0;height:0;opacity:0;pointer-events:none"></audio>

  <!-- Hidden elements referenced by JS -->
  <span id="selfId" hidden></span>
  <span id="selfPeerId" hidden></span>
  <div id="networkStatus" hidden><span id="statusText"></span></div>
  <input id="inviteLink" hidden>
  <img id="inviteQr" hidden>
  <span id="inviteHint" hidden></span>
  <input type="file" id="avatarUploadInput" accept="image/*" hidden onchange="handleAvatarUpload(event)">

  <!-- APP LOCK / DISGUISE overlay (filled by app/core/applock.js) -->
  <div id="lockScreen" hidden></div>

  <!-- AUTH GATE -->
  <div id="authGate">
    <div id="authShell">
      <img id="authLogo" src="/tract.svg" alt="Tract" style="width:72px;height:72px;display:block;margin:8px auto;">
      <div id="authTitle" style="text-align:center;font-size:18px;font-weight:600;margin:8px 0 4px;"></div>
      <div id="registerPanel" class="stack" style="gap:12px;" hidden>
        <div class="field">
          <label>Код приглашения</label>
          <input id="regInviteCode" type="text" placeholder="Код из ссылки" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
        <div class="field">
          <label>ID</label>
          <div style="position:relative;">
            <span class="input-prefix">@</span>
            <input id="regName" type="text" placeholder="login" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="padding-left:28px;">
          </div>
        </div>
        <div class="field">
          <label>Пароль</label>
          <input id="regPassword" type="password" placeholder="Не короче 6 символов" autocomplete="new-password">
        </div>
        <div class="field">
          <label>Повтор пароля</label>
          <input id="regPasswordConfirm" type="password" placeholder="Ещё раз" autocomplete="new-password">
        </div>
        <button class="btn primary" type="button" onclick="registerAccount()">Создать аккаунт</button>
        <button class="btn subtle" type="button" onclick="showLogin()">Уже есть аккаунт</button>
      </div>
      <div id="loginPanel" class="stack" style="gap:12px;">
        <div class="field">
          <label>Логин</label>
          <div style="position:relative;">
            <span class="input-prefix">@</span>
            <input id="loginName" type="text" placeholder="login" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="padding-left:28px;" oninput="onLoginNameInput()">
          </div>
        </div>
        <div id="loginPasswordField" class="field" hidden>
          <label>Пароль</label>
          <input id="loginPassword" type="password" placeholder="Пароль" autocomplete="off">
        </div>
        <button class="btn primary" type="button" onclick="loginAccount()" id="loginBtn">Войти</button>
      </div>
      <div id="authError"></div>
    </div>
  </div>

  <!-- POST-AUTH CONTENT (hidden until login) -->
  <template id="postAuth">
  <!-- CALL BAR -->
  <div id="callBar" hidden>
    <div id="callBarLabel"></div>
    <div id="callBarActions"></div>
  </div>

  <!-- MAIN APP -->
  <div id="app" hidden>
    <!-- SIDEBAR -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <img id="appLogo" src="/tract.svg" alt="Tract">
        <div class="sidebar-header-right">
          <button type="button" class="sidebar-header-btn" onclick="openNewMessage()" title="Новое сообщение"><span class="material-icons">edit</span></button>
          <button type="button" class="sidebar-header-btn" onclick="switchView('settings')" title="Настройки"><span class="material-icons">settings</span></button>
        </div>
      </div>

      <!-- Search -->
      <div class="search-section">
        <div class="search-row" style="position:relative;">
          <span class="input-prefix" style="left:14px;">@</span>
          <input id="addUserId" type="text" placeholder="поиск по логину" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="padding-left:28px;">
          <button type="button" class="search-btn" onclick="addContactById()">Найти</button>
        </div>
      </div>

      <div class="sidebar-tabs">
        <button type="button" class="tab-btn active" id="tabChats" onclick="switchView('chats')">Чаты</button>
        <button type="button" class="tab-btn" id="tabContacts" onclick="switchView('contacts')">Контакты</button>
      </div>

      <div class="sidebar-views">
        <!-- CHATS VIEW -->
        <div id="viewChats" class="sidebar-view active">

            <!-- Contacts rendered here -->
            <div id="contacts"></div>
          </div>
        </div>

        <!-- CONTACTS VIEW -->
        <div id="viewContacts" class="sidebar-view">
          <div class="sidebar-view-scroll">
            <div class="section-title">Все контакты</div>
            <div id="contactsList"></div>
          </div>
        </div>

        <!-- SETTINGS VIEW -->
        <div id="viewSettings" class="sidebar-view">
          <div class="sidebar-view-scroll">
            <div class="settings-view">
              <!-- Profile Section -->
              <div class="settings-section" style="padding:20px;">
                <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
                    <div class="avatar-upload" id="avatarUploadWrapper" onclick="openAvatarViewer()">
                    <div class="card-avatar" id="profileAvatarSettings" style="width:80px;height:80px;min-width:80px;font-size:36px;">−</div>
                    <div class="avatar-crop-frame"></div>
                    <div class="avatar-camera-overlay"><span class="material-icons" style="font-size:13px;">photo_camera</span></div>
                  </div>
                  <div style="text-align:center;">
                    <div class="card-profile-name" id="profileNameSettings" style="font-size:18px;font-weight:600;">−</div>

                  </div>
                </div>
                <div class="field" style="margin-top:12px;">
                  <label>Отображаемое имя</label>
                  <div style="position:relative;">
                    <input id="displayNameInput" type="text" placeholder="Введите имя"
                      style="background:var(--panel-input);border:1.5px solid var(--accent);color:var(--text);padding:10px 40px 10px 12px;border-radius:8px;width:100%;font-size:16px;">
                    <span class="material-icons" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--accent);font-size:18px;pointer-events:none;">edit</span>

              <div class="settings-section-title">УВЕДОМЛЕНИЯ</div>

              </div>

              <div class="settings-section-title">КОНФИДЕНЦИАЛЬНОСТЬ</div>

                  </div>

                    <span class="toggle-value" id="hideOnlineLabel">Виден</span>
                    <input type="checkbox" id="hideOnlineToggle" onchange="toggleHideOnline()">
                  </div>
                </div>
              </div>

              <div class="settings-section-title">БЛОКИРОВКА</div>
              <div class="settings-section">
                <div class="settings-row" onclick="openLockSettings()" style="cursor:pointer;">
                  <span class="settings-label">Код-пароль и маскировка</span>
                  <span class="settings-value" id="lockStatusValue">Выкл</span>
                </div>
              </div>

              <div class="settings-section-title">ВИД</div>
              <div class="settings-section">
                <div class="settings-row">
                  <span class="settings-label">Тема</span>
                  <span class="settings-value">Тёмная</span>
                </div>
              </div>

              <div class="settings-section" style="border:1px solid rgba(229,101,101,0.25);margin-top:8px;">
                <div class="settings-row">
                  <span class="settings-label" style="color:var(--danger);">Выйти из аккаунта</span>
                  <button type="button" class="btn subtle" onclick="logoutAccount()" style="border-color:var(--danger);color:var(--danger);padding:6px 12px;font-size:13px;">Выйти</button>
                </div>
              </div>

              <div id="adminPanel" class="settings-section-title" style="display:none;">АДМИНИСТРИРОВАНИЕ</div>
              <div id="adminSection" class="settings-section" style="display:none;flex-direction:column;gap:8px;">
                <button type="button" class="btn primary" onclick="generateInvite()" style="margin-bottom:4px;">
                  <span class="material-icons" style="font-size:16px;">link</span> Создать ссылку-приглашение
                </button>
                <div id="adminInviteResult" style="font-size:12px;color:var(--muted);word-break:break-all;"></div>
                <div class="settings-section-title" style="padding:8px 0 4px;font-size:11px;">ПОЛЬЗОВАТЕЛИ</div>
                <div id="adminUserList" style="max-height:200px;overflow-y:auto;"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- contact profile is now a full-screen page, see #contactProfilePage below -->
      </div>
    </aside>

    <!-- CHAT MAIN -->
    <main id="chat">
      <header id="chatHeader">
        <button type="button" class="header-back-btn" onclick="goBackFromChat()">←</button>
        <div id="chatHeaderAvatar" hidden></div>
        <div id="chatHeaderMain">
          <div id="chatTitle" class="chat-header-title">Чаты</div>
          <div id="chatSubtitle">Выберите диалог</div>
        </div>
        <div class="header-actions">
          <button type="button" class="icon-btn" id="btnCall" hidden onclick="startVoiceCall()" title="Звонок"><span class="material-icons">phone</span></button>
          <button type="button" class="icon-btn" id="btnChatMenu" hidden onclick="toggleChatMenu()" title="Ещё"><span class="material-icons">more_vert</span></button>
          <div class="chat-menu" id="chatMenu" hidden>
            <button type="button" onclick="clearCurrentHistory('me')">Очистить у меня</button>
            <button type="button" onclick="clearCurrentHistory('all')">Очистить у всех</button>
          </div>
        </div>
      </header>

      <section id="messages">
        <div class="empty-chat">Войдите и найдите контакт по логину</div>
      </section>

      <div id="selectionBar" hidden>
        <span class="meta">Выбрано: <span id="selectionCount">0</span></span>
        <button type="button" class="btn" onclick="deleteSelectedMessages('me')">У меня</button>
        <button type="button" class="btn" onclick="deleteSelectedMessages('all')">У всех</button>
        <button type="button" class="btn" onclick="clearMessageSelection()">Снять</button>
      </div>

      <footer id="composer">
        <div id="composerRow">
          <input id="messageInput" type="text" placeholder="Сообщение" enterkeyhint="send" autocomplete="off"
            onkeydown="if(event.key==='Enter') sendCurrentMessage()">
          <button type="button" class="btn primary" id="sendBtn" onclick="sendCurrentMessage()" title="Отправить">
            <span class="material-icons">send</span>
          </button>
        </div>
      </footer>
    </main>
  </div>

  <!-- CONTACT PROFILE PAGE (full-screen, TG-style) -->
  <div id="contactProfilePage">
    <div class="profile-page-header">
      <button type="button" class="profile-page-back" onclick="closeContactProfile()">
        <span class="material-icons">arrow_back</span>
      </button>
      <div class="profile-page-header-title">Профиль</div>
    </div>
    <div class="profile-page-scroll">
      <div class="profile-page-hero" id="profileHero">
        <!-- Small round avatar (default state) -->
        <div class="profile-page-avatar" id="profileModalAvatar">A</div>
        <div class="profile-page-name" id="profileModalName">Имя</div>
        <div class="profile-page-status" id="profileModalStatus">Не в сети</div>
        <!-- Expanded overlay (hidden by default) -->
        <div class="profile-hero-expanded" id="profileHeroExpanded">
          <div class="profile-hero-bg" id="profileHeroBg"></div>
          <div class="profile-hero-gradient"></div>
          <div class="profile-hero-info">
            <div class="profile-hero-name" id="profileHeroName"></div>
            <div class="profile-hero-id" id="profileHeroId"></div>
          </div>
        </div>
      </div>

      <!-- Action buttons row -->
      <div class="profile-page-actions">
        <button type="button" class="profile-page-action-btn" id="profileCallBtn" onclick="startVoiceCallFromProfile()">
          <span class="material-icons">phone</span>
          Звонок
        </button>
        <button type="button" class="profile-page-action-btn" id="profileBlockBtn" onclick="toggleContactBlockFromProfile()">
          <span class="material-icons">block</span>
          <span id="profileBlockLabel">Блок</span>
        </button>
        <button type="button" class="profile-page-action-btn danger" id="profileDeleteBtn" onclick="deleteContactFromProfile()">
          <span class="material-icons">delete</span>
          Удалить контакт
        </button>
      </div>

      <!-- Info section -->
      <div class="profile-page-section">
        <div class="profile-page-row">
          <span class="material-icons profile-page-row-icon">alternate_email</span>
          <div class="profile-page-row-content">
            <div class="profile-page-row-label">Логин</div>
            <div class="profile-page-row-value" id="profileModalId">@login</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- NEW MESSAGE PAGE (TG-style) -->
  <div id="newMessagePage">
    <div class="profile-page-header">
      <button type="button" class="profile-page-back" onclick="closeNewMessage()">
        <span class="material-icons">arrow_back</span>
      </button>
      <div class="profile-page-header-title">Новое сообщение</div>
    </div>
    <div class="profile-page-scroll">
      <div class="profile-page-actions" style="padding:12px 20px;">
        <button type="button" class="profile-page-action-btn" onclick="openCreateGroup()" style="min-width:120px;">
          <span class="material-icons">group_add</span>
          Новая группа
        </button>
      </div>
      <div class="contact-group-header">Контакти</div>
      <div id="newMessageContactList"></div>
    </div>
  </div>

  <!-- CREATE GROUP PAGE -->
  <div id="createGroupPage">
    <div class="profile-page-header">
      <button type="button" class="profile-page-back" onclick="closeCreateGroup()">
        <span class="material-icons">arrow_back</span>
      </button>
      <div class="profile-page-header-title">Новая группа</div>
      <button type="button" class="profile-page-action-btn" id="createGroupNextBtn" onclick="createGroupNextStep()" style="padding:6px 16px;font-size:14px;min-width:auto;border-radius:20px;background:var(--accent);color:#141515;">Далее</button>
    </div>

    <!-- Step 1: Select members -->
    <div id="createGroupStep1" class="profile-page-scroll">
      <div class="contact-group-header">Выберите участников</div>
      <div id="createGroupContactList"></div>
    </div>

    <!-- Step 2: Name & Avatar -->
    <div id="createGroupStep2" class="profile-page-scroll" hidden>
      <div class="profile-page-hero" style="padding-top:24px;">
        <div class="avatar-upload" onclick="document.getElementById('groupAvatarInput').click()">
          <div class="card-avatar" id="groupAvatarPreview" style="width:80px;height:80px;min-width:80px;font-size:32px;">G</div>
          <div class="avatar-crop-frame"></div>
          <div class="avatar-camera-overlay"><span class="material-icons" style="font-size:13px;">photo_camera</span></div>
        </div>
        <input type="file" id="groupAvatarInput" accept="image/*" hidden onchange="handleGroupAvatar(event)">
        <div class="field" style="width:100%;max-width:300px;margin-top:8px;">
          <label>Название группы</label>
          <input id="groupNameInput" type="text" placeholder="Введите название группы" style="text-align:center;font-size:16px;" oninput="updateCreateGroupBtn()">
        </div>
        <div style="font-size:13px;color:var(--muted);margin-top:8px;" id="groupSelectedCount"></div>
      </div>
      <div class="profile-page-actions" style="padding-top:8px;">
        <button type="button" class="btn primary" onclick="finishCreateGroup()" style="min-width:160px;padding:12px 24px;border-radius:24px;font-size:15px;">Создать группу</button>
      </div>
    </div>
  </div>

  <!-- GROUP INFO PAGE -->
  <div id="groupInfoPage">
    <div class="profile-page-header">
      <button type="button" class="profile-page-back" onclick="closeGroupInfo()">
        <span class="material-icons">arrow_back</span>
      </button>
      <div class="profile-page-header-title">Информация</div>
    </div>
    <div class="profile-page-scroll">
      <div class="profile-page-hero">
        <div class="profile-page-avatar" id="groupInfoAvatar">G</div>
        <div class="profile-page-name" id="groupInfoName">Группа</div>
        <div class="profile-page-status" id="groupInfoMemberCount"></div>
      </div>
      <div class="profile-page-section">
        <div class="profile-page-row">
          <span class="material-icons profile-page-row-icon">info</span>
          <div class="profile-page-row-content">
            <div class="profile-page-row-label">Описание</div>
            <div class="profile-page-row-value">Групповой чат</div>
          </div>
        </div>
      </div>
      <div class="contact-group-header">Участники (<span id="groupInfoMembersNum">0</span>)</div>
      <div id="groupInfoMemberList"></div>
      <div class="profile-page-actions" style="padding:16px 20px;display:flex;flex-direction:column;gap:8px;">
        <button type="button" class="profile-page-action-btn danger" onclick="leaveGroup()">
          <span class="material-icons">exit_to_app</span>
          Покинуть группу
        </button>
        <button type="button" class="profile-page-action-btn danger-outline" id="deleteGroupBtn" onclick="deleteGroup()" style="display:none;">
          <span class="material-icons">delete_forever</span>
          Удалить группу
        </button>
      </div>
    </div>
  </div>

  <div id="swUpdateToast" class="sw-update-toast">
    <span>Доступна новая версия</span>
    <button type="button" class="sw-update-btn">Обновить</button>
  </div>
  </template>

  <script type="module" src="main.js"></script>
</body>
</html>
